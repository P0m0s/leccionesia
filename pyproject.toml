[project]
name = "estimador-cag"
version = "0.1.0"
description = "API FastAPI con CAG para estimaciones de software vía LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.57.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.40.0",
    "jinja2>=3.1.4",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "W",
]
ignore = [
    "E501",
    "B008",
    "B017",
    "B904",
    "UP042",
    "UP028",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"streamlit_app.py" = ["E402"]
"app/routers/sessions.py" = ["E402"]
