name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master", "pre-session-05"]

jobs:
  tests:
    name: tests (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          LLM_PROVIDER: openai
          OPENAI_API_KEY: dummy-key-for-tests-not-real
          ANTHROPIC_API_KEY: dummy-key-for-tests-not-real
        run: |
          pytest -q --durations=10

      - name: Smoke import Streamlit app
        run: |
          python -c "import streamlit_app" || true

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check app/ tests/ streamlit_app.py
